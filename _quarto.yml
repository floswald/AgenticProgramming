# Format convention (see CLAUDE.md "Conventions"):
#   - Slides are the project default format (revealjs, once #14 lands) and
#     should not repeat shared options in their own frontmatter.
#   - Narrative/doc pages (not slides) opt out of the slide default by
#     setting `format: html` in their OWN frontmatter (see 00-prework.qmd).
#     Shared html options that ALL such pages want (theme, css, toc,
#     highlight-style, etc.) live here, in this `format.html` block, so a
#     narrative page's frontmatter only needs `format: html` plus any
#     genuinely page-specific overrides.
format:
  html:
    theme: journal
    linkcolor: "#ba0202"
    css: styles.css
    toc: true
    highlight-style: github
  clean-revealjs:
    logo: /images/ScPo-logo.png
    footer: "[Agentic Programming](https://floswald.github.io/AgenticProgramming/)"
    chalkboard: true
    incremental: false
    code-line-numbers: false
    highlight-style: github







